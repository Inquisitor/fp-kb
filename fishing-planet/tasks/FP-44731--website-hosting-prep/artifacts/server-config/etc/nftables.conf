#!/usr/sbin/nft -f
# Reset only this table. A full "flush ruleset" would also wipe Docker's own nat/filter
# rules and cut container internet access, so scope the reset to inet filter.
table inet filter
delete table inet filter

table inet filter {
    # SSH allowlist:
    #   5.249.108.171  - Portugal office egress
    #   109.86.89.251  - Kyiv office ISP 1
    #   82.193.99.168  - Kyiv office ISP 2
    #   193.34.218.232 - Kyiv office ISP 3 (reserve)
    #   192.40.222.26  - VPN (vpn.fishingplanet.com)
    #   8.44.201.100   - admin WireGuard
    set ssh_allow_v4 {
        type ipv4_addr
        elements = { 5.249.108.171, 109.86.89.251, 82.193.99.168, 193.34.218.232, 192.40.222.26, 8.44.201.100 }
    }
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept
        tcp dport 22 ip saddr @ssh_allow_v4 accept
        tcp dport { 80, 443 } accept
        tcp dport 2222 accept
    }
    chain forward {
        # Runs after Docker (priority 10) so it does not disturb Docker's own forward handling.
        # Accept replies first - visitors reaching the site via the VPN gateway, which lives
        # inside the internal range, must still get answered - then block only NEW connections
        # initiated toward the internal range (the container-to-farm pivot).
        type filter hook forward priority 10; policy accept;
        ct state established,related accept
        ip daddr 192.40.222.0/24 ct state new drop
    }
    chain output {
        type filter hook output priority 0; policy accept;
        # Host-originated block to the internal range; replies to inbound are established.
        ct state established,related accept
        ip daddr 192.40.222.0/24 ct state new drop
    }
}
