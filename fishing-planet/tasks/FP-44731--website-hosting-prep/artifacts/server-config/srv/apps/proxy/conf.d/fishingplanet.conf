# edge proxy for fp-main-website. wp-admin / wp-login are not IP-restricted here yet;
# add an allow/deny before this host is publicly reachable.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name fishingplanet.com www.fishingplanet.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fishingplanet.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fishingplanet.key.pem;
    return 444;
}
server {
    listen 443 ssl;
    http2 on;
    server_name fishingplanet.com www.fishingplanet.com;
    ssl_certificate     /etc/nginx/certs/fishingplanet.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fishingplanet.key.pem;
    client_max_body_size 256m;
    # Match the application's FastCGI timeouts, otherwise the edge cuts long admin requests
    # (migrations, imports) at the default 60s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Resolve the upstream per request; a literal name is cached at startup and recreating the
    # container would serve 502s until this proxy is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        include snippets/proxy.conf;
        set $upstream_site fp-main-website-nginx;
        proxy_pass http://$upstream_site;
    }
}
