# phpMyAdmin on its own subdomain. HTTP basic-auth sits in front of it (so scanners never reach
# phpMyAdmin itself); the phpMyAdmin login then uses the site DB user, not root. TLS via the wildcard.
server {
    listen 80;
    server_name pma.fishingplanet.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name pma.fishingplanet.com;
    ssl_certificate     /etc/nginx/certs/fishingplanet.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fishingplanet.key.pem;
    client_max_body_size 512m;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        include snippets/proxy.conf;
        set $upstream_pma fp-main-website-pma:80;
        proxy_pass http://$upstream_pma;
    }
}
