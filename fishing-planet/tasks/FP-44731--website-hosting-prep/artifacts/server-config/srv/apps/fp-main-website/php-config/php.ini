; Site PHP limits. The stock defaults (2M uploads, 128M memory) are far below what media uploads
; and database-migration plugins need, and they contradict the 512m body size allowed by nginx.
memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
