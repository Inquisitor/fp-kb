server {
    listen 80;
    server_name fishingplanet.com www.fishingplanet.com;
    root /var/www/html;
    index index.php;
    client_max_body_size 256m;

    # Resolve the php upstream per request through Docker's embedded DNS. With a literal
    # fastcgi_pass the address is cached at startup, so recreating the php container (new IP)
    # breaks every request with 502 until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # These denials must precede the generic PHP handler: nginx picks the first matching regex
    # location, so placing them after it would leave uploaded PHP executable.
    location ~* ^/wp-content/uploads/.*\.(php|phar|phtml|php[0-9])$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        # Refuse paths that do not map to a real file, so a crafted PATH_INFO cannot smuggle
        # execution of an uploaded file through a legitimate script name.
        try_files $uri =404;
        include fastcgi_params;
        set $upstream php:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Long-running admin work (migrations, imports) must not be cut off mid-request.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }
}
