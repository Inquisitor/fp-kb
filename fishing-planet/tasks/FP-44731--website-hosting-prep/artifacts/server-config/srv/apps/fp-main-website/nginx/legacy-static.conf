# Compatibility for the static pages carried over from the previous site.
#
# The previous host ran on Windows and matched paths case-insensitively, so links in outgoing
# mail, store pages and platform submissions use lower-case spellings that do not match the
# files on disk. Each rule below maps such a link to the real file.
#
# All of this exists only while these files are served from disk. Once the content lives in
# the CMS under its own URLs, delete this file - the main config includes it by wildcard, so
# nothing else needs editing.

# Serve a directory index.html on the bare path, the way the previous host answered.
index index.html index.php;

# Documents and downloads whose real name is mixed-case.
location = /fan_kit.zip { try_files /Fan_Kit.zip =404; }
location = /gamerules.htm { try_files /GameRules.htm =404; }
location = /gamerulespc.htm { try_files /GameRulesPC.htm =404; }
location = /gamerulesr.htm { try_files /GameRulesr.htm =404; }
location = /mobile/tournamentrules.htm { try_files /mobile/TournamentRules.htm =404; }
location = /nintendo/tournamentrules.htm { try_files /nintendo/TournamentRules.htm =404; }
location = /pc/denuvo.htm { try_files /pc/Denuvo.htm =404; }
location = /pc/gamerules.htm { try_files /pc/GameRules.htm =404; }
location = /pcr/gamerules.htm { try_files /pcr/GameRules.htm =404; }
location = /tournamentrules.htm { try_files /TournamentRules.htm =404; }
location = /tournamentrulesr.htm { try_files /TournamentRulesr.htm =404; }

# Retail locale folders are upper-case on disk.
rewrite ^/consoler/lang/cn/(.*)$ /consoler/lang/CN/$1 last;
rewrite ^/consoler/lang/de/(.*)$ /consoler/lang/DE/$1 last;
rewrite ^/consoler/lang/en/(.*)$ /consoler/lang/EN/$1 last;
rewrite ^/consoler/lang/es/(.*)$ /consoler/lang/ES/$1 last;
rewrite ^/consoler/lang/fr/(.*)$ /consoler/lang/FR/$1 last;
rewrite ^/consoler/lang/it/(.*)$ /consoler/lang/IT/$1 last;
rewrite ^/consoler/lang/nl/(.*)$ /consoler/lang/NL/$1 last;
rewrite ^/consoler/lang/pl/(.*)$ /consoler/lang/PL/$1 last;
rewrite ^/consoler/lang/pt/(.*)$ /consoler/lang/PT/$1 last;
rewrite ^/consoler/lang/ru/(.*)$ /consoler/lang/RU/$1 last;
rewrite ^/consoler/lang/ua/(.*)$ /consoler/lang/UA/$1 last;
rewrite ^/consoler/lang/zn/(.*)$ /consoler/lang/ZN/$1 last;
