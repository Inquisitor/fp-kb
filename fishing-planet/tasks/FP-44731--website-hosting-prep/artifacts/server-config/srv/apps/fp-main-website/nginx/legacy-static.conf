# Compatibility for the static pages carried over from the previous site.
#
# The previous host ran on Windows and matched paths case-insensitively, so links in outgoing mail,
# store pages and platform submissions use spellings that do not match the files on disk. Matching
# here is case-insensitive, but each target still names the real file: only the URL match ignores
# case, while the filesystem lookup that follows does not.
#
# All of this exists only while these files are served from disk. Once the content lives in the CMS
# under its own URLs, delete this file - the site config includes it by wildcard from a mounted
# directory, so nothing else needs editing.

# Serve a directory index.html on the bare path, the way the previous host answered. index.php stays
# first so a stray index.html cannot shadow application routing; the carried-over folders have none.
index index.php index.html;

# Documents and downloads whose real name is mixed-case.
location ~* ^/Fan_Kit\.zip$ { try_files /Fan_Kit.zip =404; }
location ~* ^/GameRules\.htm$ { try_files /GameRules.htm =404; }
location ~* ^/GameRulesPC\.htm$ { try_files /GameRulesPC.htm =404; }
location ~* ^/GameRulesr\.htm$ { try_files /GameRulesr.htm =404; }
location ~* ^/mobile/TournamentRules\.htm$ { try_files /mobile/TournamentRules.htm =404; }
location ~* ^/nintendo/TournamentRules\.htm$ { try_files /nintendo/TournamentRules.htm =404; }
location ~* ^/pc/Denuvo\.htm$ { try_files /pc/Denuvo.htm =404; }
location ~* ^/pc/GameRules\.htm$ { try_files /pc/GameRules.htm =404; }
location ~* ^/pcr/GameRules\.htm$ { try_files /pcr/GameRules.htm =404; }
location ~* ^/TournamentRules\.htm$ { try_files /TournamentRules.htm =404; }
location ~* ^/TournamentRulesr\.htm$ { try_files /TournamentRulesr.htm =404; }

# Retail locale folders are upper-case on disk.
rewrite "(?i)^/consoler/lang/11/(.*)$" /consoler/lang/11/$1 last;
rewrite "(?i)^/consoler/lang/CN/(.*)$" /consoler/lang/CN/$1 last;
rewrite "(?i)^/consoler/lang/DE/(.*)$" /consoler/lang/DE/$1 last;
rewrite "(?i)^/consoler/lang/EN/(.*)$" /consoler/lang/EN/$1 last;
rewrite "(?i)^/consoler/lang/ES/(.*)$" /consoler/lang/ES/$1 last;
rewrite "(?i)^/consoler/lang/FR/(.*)$" /consoler/lang/FR/$1 last;
rewrite "(?i)^/consoler/lang/IT/(.*)$" /consoler/lang/IT/$1 last;
rewrite "(?i)^/consoler/lang/NL/(.*)$" /consoler/lang/NL/$1 last;
rewrite "(?i)^/consoler/lang/PL/(.*)$" /consoler/lang/PL/$1 last;
rewrite "(?i)^/consoler/lang/PT/(.*)$" /consoler/lang/PT/$1 last;
rewrite "(?i)^/consoler/lang/RU/(.*)$" /consoler/lang/RU/$1 last;
rewrite "(?i)^/consoler/lang/UA/(.*)$" /consoler/lang/UA/$1 last;
rewrite "(?i)^/consoler/lang/ZN/(.*)$" /consoler/lang/ZN/$1 last;
