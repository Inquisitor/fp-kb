name: fp-main-website
services:
  web:
    image: nginx:1.27-alpine
    container_name: fp-main-website-nginx
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/wp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks: [front, back]
  php:
    image: wordpress:6.9-php8.4-fpm
    container_name: fp-main-website-php
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    group_add: ["1004"]
    pids_limit: 256
    mem_limit: 1g
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', 'https://fishingplanet.com');
        define('WP_SITEURL', 'https://fishingplanet.com');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - ./html:/var/www/html
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/sendgrid-mailsend.key:/run/secrets/sendgrid_key:ro
      - ./php-config/mail.php:/var/www/html/wp-content/mu-plugins/00-mail.php:ro
      - ./php-config/cron.php:/var/www/html/wp-content/mu-plugins/01-cron.php:ro
      - ./php-config/updates.php:/var/www/html/wp-content/mu-plugins/02-updates.php:ro
      - ./php-config/php.ini:/usr/local/etc/php/conf.d/zz-site.ini:ro
    networks: [back]
  redis:
    # Object cache backend. Internal network only, never published. Cache data is disposable,
    # so persistence is off and memory is capped with LRU eviction.
    image: redis:7-alpine
    container_name: fp-main-website-redis
    restart: unless-stopped
    # Start as the redis user directly: with all capabilities dropped the entrypoint cannot
    # setuid away from root itself.
    user: "redis"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 384m
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [back]
  db:
    image: mariadb:11.4
    container_name: fp-main-website-db
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    pids_limit: 512
    mem_limit: 1g
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/db_root_password:/run/secrets/db_root_password:ro
    networks: [back]
  toolbox:
    # Contractor console: WP-CLI + file/db access as www-data, no host access.
    image: wordpress:cli-php8.4
    container_name: fp-main-website-toolbox
    restart: unless-stopped
    user: "33:33"
    group_add: ["1004"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    entrypoint: ["tail", "-f", "/dev/null"]
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./html:/var/www/html
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/sendgrid-mailsend.key:/run/secrets/sendgrid_key:ro
      # The same runtime config as the web container: mu-plugins are mounted per file, so without
      # these the CLI would see empty placeholders and run with none of the site's constants
      # (mail routing, redis backend) - and the host cron runs its jobs in here.
      - ./php-config/mail.php:/var/www/html/wp-content/mu-plugins/00-mail.php:ro
      - ./php-config/cron.php:/var/www/html/wp-content/mu-plugins/01-cron.php:ro
      - ./php-config/updates.php:/var/www/html/wp-content/mu-plugins/02-updates.php:ro
      - ./php-config/php.ini:/usr/local/etc/php/conf.d/zz-site.ini:ro
    networks: [back]
  phpmyadmin:
    # Contractor DB web UI. Reached only behind the edge basic-auth; login is the site DB user, not root.
    image: phpmyadmin:5
    container_name: fp-main-website-pma
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://pma.fishingplanet.com/
      UPLOAD_LIMIT: 512M
    networks: [front, back]
volumes:
  db_data: {}
networks:
  front:
    name: fp-main-website_front
    external: true
  back:
    name: fp-main-website_back
